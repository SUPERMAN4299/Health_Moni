<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact</title>

  <!-- Fonts and Tailwind -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/> 
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <!-- External CSS -->
  <style>
    input, textarea {
      background-color: rgba(0,0,0,0.2) !important;
      color: white !important;
    }
  </style>

  <link rel="stylesheet" href="contact.css"/>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#06d0f9",
            "background-light": "#f5f8f8",
            "background-dark": "#0f1f23",
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px",
          },
        },
      },
    };
  </script>
</head>

<body class="bg-background-light dark:bg-background-dark text-white/90 antialiased">
  <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
    <!-- Background -->
    <div class="absolute inset-0 bg-cover bg-center" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAuviuhJlMmkM1vdo7qcV_yGrsDt_oVxmkuuTj6p9wgftUrNugG96xUqwRiqF8HYqJKF892iGat1J9bk3dwOaMMyGOnIu3Myn6sMTEBrnC-XBRjce0YAU8I3F41j10kfIhFS29zmg-8VG3qcFnqRWe3S3FI4vI2-BCCH7C-bH9uCybYfclaOH8rR-XqyUWvEnxxQTlA84faUzQKniohLxLoTr35YZTBS8RVoZE67ZbZQYULl5G8lMH9rEsnQhefs3Lw4mWu3vHWAxc"); filter: blur(20px) brightness(0.5);'></div>
    <div class="absolute inset-0 bg-background-dark/80 backdrop-blur-sm"></div>

    <div class="relative z-10 flex h-full grow flex-col">

      <!-- Header -->
      <header class="flex items-center justify-between whitespace-nowrap border-b border-white/10 px-10 py-4">
        <div class="flex items-center gap-3 text-white">
          <svg class="text-primary icon-glow" fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.5L4 7.5V17.5L12 22.5L20 17.5V7.5L12 2.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
            <path d="M12 12.5L20 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
            <path d="M12 12.5V22.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
            <path d="M12 12.5L4 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
            <path d="M8.5 5L15.5 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
          </svg>
          <h2 class="text-xl font-bold tracking-wider">Health_Moni Project</h2>
        </div>

        <nav class="flex items-center gap-8 text-sm font-medium">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="index1.html">Quary</a>
          <a class="nav-link-active" href="contact.html">Contact</a>
        </nav>
      </header>

      <!-- Main -->
      <main class="flex flex-1 items-center justify-center p-4 sm:p-6 md:p-8">
        <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 bg-black/20 dark:bg-background-dark/50 border border-white/10 rounded-xl p-8 backdrop-blur-lg">

          <!-- Contact Form -->
          <div class="flex flex-col">
            <div class="mb-8 text-center lg:text-left">
              <h1 class="text-4xl font-bold text-white tracking-widest">CONTACT US</h1>
              <p class="text-white/60 mt-2">We’d love to hear from you.</p>
            </div>

            <form class="space-y-6">
              <input class="input-field" id="full-name" type="text" placeholder="Full Name"/>
              <input class="input-field" id="email" type="email" placeholder="Email Address"/>
              <input class="input-field" id="subject" type="text" placeholder="Subject"/>
              <textarea class="input-field resize-none" id="message" rows="5" placeholder="Your Message"></textarea>

              <button class="submit-btn glow" type="submit">Submit</button>
            </form>
          </div>

          <!-- Contact Info -->
          <div class="flex flex-col justify-center space-y-8 border-t border-white/10 lg:border-t-0 lg:border-l lg:pl-12 pt-8 lg:pt-0">
            <div class="contact-item">
              <div class="contact-icon">
                <svg class="text-primary icon-glow h-6 w-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
              <div>
                <h3 class="contact-title">Email</h3>
                <p class="contact-detail">healthmoni_ums@demo.com</p>
              </div>
            </div>

            <div class="contact-item">
              <div class="contact-icon">
                <svg class="text-primary icon-glow h-6 w-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
              </div>
              <div>
                <h3 class="contact-title">Phone</h3>
                <p class="contact-detail">+91 700XXXXXXX</p>
              </div>
            </div>

            <div class="contact-item">
              <div class="contact-icon">
                <svg class="text-primary icon-glow h-6 w-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </div>
              <div>
                <h3 class="contact-title">Address</h3>
                <p class="contact-detail">USHA MARTHIN WORLD SCHOOL</p>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="mt-auto border-t border-white/10 px-10 py-6">
        <div class="mx-auto flex max-w-5xl items-center justify-between">
          <p class="text-sm text-white/50">Health_Moni By UMWS team</p>
        </div>
      </footer>

    </div>
  </div>
</body>
</html>
