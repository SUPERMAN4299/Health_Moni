<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<style type="text/tailwindcss">
  @layer base {
    body {
      font-family: 'Space Grotesk', sans-serif;
    }
  }
  .glow {
    box-shadow: 0 0 5px theme("colors.primary"),
      0 0 10px theme("colors.primary"), 0 0 15px theme("colors.primary");
  }
  .icon-glow {
    filter: drop-shadow(0 0 3px theme("colors.primary"))
      drop-shadow(0 0 6px theme("colors.primary"));
  }
</style>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#06d0f9",
          "background-light": "#f5f8f8",
          "background-dark": "#0f1f23",
        },
        fontFamily: {
          display: ["Space Grotesk", "sans-serif"],
        },
        borderRadius: {
          DEFAULT: "0.25rem",
          lg: "0.5rem",
          xl: "0.75rem",
          full: "9999px",
        },
      },
    },
  };
</script>
</head>
<body class="bg-background-light dark:bg-background-dark text-white/90 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
  <div class="absolute inset-0 bg-cover bg-center" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAuviuhJlMmkM1vdo7qcV_yGrsDt_oVxmkuuTj6p9wgftUrNugG96xUqwRiqF8HYqJKF892iGat1J9bk3dwOaMMyGOnIu3Myn6sMTEBrnC-XBRjce0YAU8I3F41j10kfIhFS29zmg-8VG3qcFnqRWe3S3FI4vI2-BCCH7C-bH9uCybYfclaOH8rR-XqyUWvEnxxQTlA84faUzQKniohLxLoTr35YZTBS8RVoZE67ZbZQYULl5G8lMH9rEsnQhefs3Lw4mWu3vHWAxc"); filter: blur(20px) brightness(0.5);'></div>
  <div class="absolute inset-0 bg-background-dark/80 backdrop-blur-sm"></div>
  <div class="relative z-10 flex h-full grow flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between whitespace-nowrap border-b border-white/10 px-10 py-4">
      <div class="flex items-center gap-3 text-white">
        <svg class="text-primary icon-glow" fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.5L4 7.5V17.5L12 22.5L20 17.5V7.5L12 2.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
          <path d="M12 12.5L20 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
          <path d="M12 12.5V22.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
          <path d="M12 12.5L4 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
          <path d="M8.5 5L15.5 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
        </svg>
        <h2 class="text-xl font-bold tracking-wider">Health_Moni Project</h2>
      </div>
      <nav class="flex items-center gap-8 text-sm font-medium">
        <a class="text-white/80 transition-colors hover:text-white hover:text-shadow-[0_0_5px_#06d0f9]" href="index.html">Home</a>
        <a class="text-white/80 transition-colors hover:text-white hover:text-shadow-[0_0_5px_#06d0f9]" href="index1.html">Quary</a>
        <a class="text-primary transition-colors hover:text-white hover:text-shadow-[0_0_5px_#06d0f9] font-bold" href="contact.html">Contact</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="flex flex-1 items-center justify-center p-4 sm:p-6 md:p-8">
      <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 bg-black/20 dark:bg-background-dark/50 border border-white/10 rounded-xl p-8 backdrop-blur-lg">

        <!-- Contact Form -->
        <div class="flex flex-col">
          <div class="mb-8 text-center lg:text-left">
            <h1 class="text-4xl font-bold text-white tracking-widest">CONTACT US</h1>
            <p class="text-white/60 mt-2">We’d love to hear from you.</p>
          </div>
          <form class="space-y-6">
            <div>
              <label class="sr-only" for="full-name">Full Name</label>
              <input class="form-input w-full rounded-lg border-2 border-white/10 bg-black/20 dark:bg-background-dark/30 p-3.5 text-sm text-white placeholder:text-white/40 focus:border-primary focus:ring-0 focus:shadow-[0_0_10px_rgba(6,208,249,0.5)] transition-all duration-300" id="full-name" placeholder="Full Name" type="text"/>
            </div>
            <div>
              <label class="sr-only" for="email">Email Address</label>
              <input class="form-input w-full rounded-lg border-2 border-white/10 bg-black/20 dark:bg-background-dark/30 p-3.5 text-sm text-white placeholder:text-white/40 focus:border-primary focus:ring-0 focus:shadow-[0_0_10px_rgba(6,208,249,0.5)] transition-all duration-300" id="email" placeholder="Email Address" type="email"/>
            </div>
            <div>
              <label class="sr-only" for="subject">Subject</label>
              <input class="form-input w-full rounded-lg border-2 border-white/10 bg-black/20 dark:bg-background-dark/30 p-3.5 text-sm text-white placeholder:text-white/40 focus:border-primary focus:ring-0 focus:shadow-[0_0_10px_rgba(6,208,249,0.5)] transition-all duration-300" id="subject" placeholder="Subject" type="text"/>
            </div>
            <div>
              <label class="sr-only" for="message">Message</label>
              <textarea class="form-textarea w-full rounded-lg border-2 border-white/10 bg-black/20 dark:bg-background-dark/30 p-3.5 text-sm text-white placeholder:text-white/40 focus:border-primary focus:ring-0 focus:shadow-[0_0_10px_rgba(6,208,249,0.5)] transition-all duration-300 resize-none" id="message" placeholder="Your Message" rows="5"></textarea>
            </div>
            <div>
              <button class="w-full rounded-lg bg-primary py-3.5 text-sm font-bold text-background-dark tracking-wider uppercase transition-all duration-300 hover:bg-primary/90 glow" type="submit">Submit</button>
            </div>
          </form>
        </div>

        <!-- Contact Info -->
        <div class="flex flex-col justify-center space-y-8 border-t border-white/10 lg:border-t-0 lg:border-l lg:pl-12 pt-8 lg:pt-0">
          <div class="flex items-start gap-5">
            <div class="flex-shrink-0 rounded-full bg-primary/10 p-3 border border-primary/30">
              <svg class="text-primary icon-glow h-6 w-6" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-bold text-white">Email</h3>
              <p class="text-sm text-white/60">support@healthmoni.com</p>
            </div>
          </div>
          <div class="flex items-start gap-5">
            <div class="flex-shrink-0 rounded-full bg-primary/10 p-3 border border-primary/30">
              <svg class="text-primary icon-glow h-6 w-6" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-bold text-white">Phone</h3>
              <p class="text-sm text-white/60">+1 (555) 123-4567</p>
            </div>
          </div>
          <div class="flex items-start gap-5">
            <div class="flex-shrink-0 rounded-full bg-primary/10 p-3 border border-primary/30">
              <svg class="text-primary icon-glow h-6 w-6" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-bold text-white">Address</h3>
              <p class="text-sm text-white/60">123 Innovation Drive, Tech City, CA 90210</p>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-white/10 px-10 py-6">
      <div class="mx-auto flex max-w-5xl items-center justify-between">
        <p class="text-sm text-white/50">© 2024 Health_Moni Project. All rights reserved.</p>
      </div>
    </footer>

  </div>
</div>
</body>
</html>
